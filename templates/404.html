{% load agrilink_tags %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — AgriLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);">
  <div style="text-align:center;padding:40px 24px;">
    <div style="width:80px;height:80px;border-radius:20px;background:var(--gold-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>

    <p style="font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;">Erreur 404</p>

    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <a href="/dashboard/" class="btn btn-forest">Tableau de bord</a>
      <a href="/marketplace/" class="btn btn-outline">Voir le marché</a>
